<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body {
            background-color: #0f172a; /* Use #ffffff if you want standard white nginx */
            color: #f1f5f9;            /* Use #000000 if you want standard black text */

            text-align: center;
            padding-top: 150px;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;

        }

        }

    <div>
        <h1>404</h1>
